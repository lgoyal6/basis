# Builds the jar somebody actually runs, on a tag.
#
# The test workflow proves a commit is sound; this one turns a tag into something
# downloadable. It runs the suite again rather than trusting that the tagged commit was
# green on push, because a tag can point at any commit and a release nobody tested is
# the one thing worse than no release.
#
# Network tagged tests stay excluded here too. A release should not fail because a market
# data provider was down, and the tests that call one prove nothing about the jar.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test
        run: ./gradlew test --console=plain

      - name: Build the jar
        run: ./gradlew bootJar --console=plain

      - name: Name it after the tag
        run: |
          mkdir -p dist
          cp build/libs/basis.jar "dist/basis-${GITHUB_REF_NAME}.jar"
          # Published alongside the jar so anyone can check what they downloaded is what
          # this workflow built.
          (cd dist && sha256sum "basis-${GITHUB_REF_NAME}.jar" > "basis-${GITHUB_REF_NAME}.jar.sha256")

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.jar
            dist/*.sha256
          generate_release_notes: true
          body: |
            Needs JDK 21 and a Postgres 16.

            ```
            java -jar basis-${{ github.ref_name }}.jar --help
            ```

            See the README for a database and a first import.
