# Something other than a laptop runs the suite.
#
# Docker is needed: the persistence and reconciliation tests use Testcontainers to
# start a real Postgres 16, because a ledger tested against an in memory database is
# tested against different rounding, different types and different constraints than
# the one it will run on. GitHub runners have Docker, so no service container is
# declared here and Testcontainers manages its own lifecycle.
#
# Network tagged tests are excluded, which is the default. They call the market data
# provider for real, spend quota, and fail when it is down, none of which should
# decide whether a pull request is green.

name: tests

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      HF_HUB_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-local-tests.txt
      - name: Install local test dependencies
        run: python -m pip install -r tools/requirements-local-tests.txt
      - name: Test local scoring, retrieval and trace contracts
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install local OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
          tesseract --version
          pdftoppm -v

      - name: Test
        run: ./gradlew test --console=plain --no-daemon --max-workers=2

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7
