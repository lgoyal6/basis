# Something other than a laptop runs the suite.
#
# Docker is needed: the persistence and reconciliation tests use Testcontainers to
# start a real Postgres 16, because a ledger tested against an in memory database is
# tested against different rounding, different types and different constraints than
# the one it will run on. GitHub runners have Docker, so no service container is
# declared here and Testcontainers manages its own lifecycle.
#
# Network tagged tests are excluded, which is the default. They call the market data
# provider for real, spend quota, and fail when it is down, none of which should
# decide whether a pull request is green.

name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test
        run: ./gradlew test --console=plain

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          retention-days: 7
