# Railway deployment.
#
# Deliberately TOML rather than Railway's newer .railway/railway.ts. The CLI warns that config
# as code is deprecated and keeps working until 2026-12-01, and this repo is Java: adding a
# TypeScript build file to configure a Java service is a worse trade than revisiting this
# before that date. Revisit it then, not sooner.
#
# The database holds public market data and anonymous counters. It never holds anything
# somebody uploaded: those live in memory for two hours and are deleted on request. See
# PRIVACY.md, and SessionStore for the code that makes it true.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Flyway runs at startup and the app refuses to serve until migrations succeed, so a failed
# migration is a failed deploy rather than a running instance against the wrong schema.
startCommand = "sh -c 'exec java $JAVA_OPTS -Dserver.port=$PORT -jar basis.jar serve'"
healthcheckPath = "/health"
healthcheckTimeout = 120
# A crash loop should stop, not continue forever. Ten attempts is enough to ride out a
# database that is still starting and few enough to notice.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Sleep when nothing is asking anything, wake on the next request.
#
# A ledger nobody is currently reconciling does not need to be running, and the alternative is
# paying continuously for a JVM's resident memory so that a link stays warm. The cost is a cold
# start on the first request after idle, which for a Spring Boot app on a JDK is seconds rather
# than milliseconds.
#
# Worth being clear about what this does not fix: the Postgres service does not sleep, so there
# is a floor to what this deployment costs. That floor is small because the app, not the
# database, is the expensive half.
sleepApplication = true
