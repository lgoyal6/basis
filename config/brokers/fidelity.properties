# Fidelity Accounts History export.
#
# Get one: log in, pick the account, Activity & Orders, History, set a date range,
# Apply, then Download. Fidelity caps each download at 90 days and keeps 5 years,
# so a full history is several files. Importing overlapping files is safe: rows
# already in the ledger are skipped.
#
# The columns below and the phrases marked "seen" were confirmed against a real
# Fidelity export. The phrases marked "researched" were not: they are documented
# Fidelity wording that that particular account never happened to produce, added
# here so a first import of a different account is less likely to stop. If one of
# them is wrong, the fix is an edit to this file and to nothing else.
#
# Lists are separated by | rather than by commas, because a column really can be
# called "Amount, Net" and a separator that appears inside values is not a separator.
# Header matching ignores case and anything in parentheses, so "Price ($)" matches
# "Price". Action matching is by longest prefix, since the real text continues past
# the verb: "YOU BOUGHT PROSHARES ULTRAPRO QQQ". Longest prefix is what lets
# INTEREST EARNED and INTEREST CHARGED sit in different rows below without either
# one swallowing the other, so never shorten a phrase to a bare verb.

profile.name = Fidelity

date.formats = MM/dd/yyyy | M/d/yyyy | yyyy-MM-dd

# Confirmed against a real export. Settlement Date is deliberately not listed: the real
# header contains it too, and it is a different day from the transaction date.
column.date        = Run Date | Date | Trade Date
column.action      = Action | Transaction Type | Description of Transaction
column.symbol      = Symbol | Ticker
column.description = Description | Security Description
column.quantity    = Quantity | Shares
column.price       = Price | Price Per Share | Average Price
column.commission  = Commission
column.fees        = Fees | Fee
column.amount      = Amount | Net Amount | Net Cash Amount

# REINVESTMENT is a plain purchase here, not income plus a purchase. A real export
# reports a reinvested distribution as TWO rows: DIVIDEND RECEIVED for the income and
# REINVESTMENT for the shares it bought. Mapping the second to a distribution as well
# would count the income twice and leave the cash balance wrong by the dividend.
action.BUY               = YOU BOUGHT | BOUGHT | PURCHASE | REINVESTMENT | DIVIDEND REINVEST
action.SELL              = YOU SOLD | SOLD | REDEMPTION
action.REINVESTMENT      =

# A cash sweep fund pays out as a dividend on its own symbol, which is why SPAXX
# income arrives here rather than under INTEREST below.
action.CASH_DIVIDEND     = DIVIDEND RECEIVED | CASH DIVIDEND | LONG-TERM CAP GAIN | SHORT-TERM CAP GAIN | CAPITAL GAIN | RETURN OF CAPITAL

# Interest on a balance, which names no security. Kept apart from dividends because
# the two are taxed differently and a question about dividend income should not find
# interest inside the answer. Interest CHARGED is the opposite sign and is a fee.
action.INTEREST          = INTEREST EARNED | INTEREST INCOME | BANK INTEREST | CREDIT INTEREST

action.FEE               = FEE CHARGED | SERVICE FEE | ADR FEE | ACCOUNT FEE | MAINTENANCE FEE | SHORT TERM REDEMPTION FEE | FOREIGN SETTLEMENT FEE | MARGIN INTEREST | INTEREST CHARGED
action.WITHHOLDING       = FOREIGN TAX PAID | TAX WITHHELD | WITHHOLDING | FEDERAL TAX WITHHELD | STATE TAX WITHHELD
action.CASH_TRANSFER     = ELECTRONIC FUNDS TRANSFER | DIRECT DEPOSIT | DIRECT DEBIT | WIRE TRANSFER | CASH CONTRIBUTION | CASH DISTRIBUTION | JOURNALED | CHECK RECEIVED | CHECK PAID | ROLLOVER CONTRIBUTION
action.SECURITY_TRANSFER = TRANSFERRED SECURITIES | TRANSFER OF ASSETS | TRANSFERRED FROM | TRANSFERRED TO

# Deliberately absent, and expected to stop an import:
#
#   MERGER, NAME CHANGE, REVERSE SPLIT, SPLIT, DISTRIBUTION, SPIN OFF,
#   CASH IN LIEU OF FRACTIONAL SHARE, EXCHANGE, CONVERSION
#
# Every one of those restates a cost basis, and a statement row says only that it
# happened, never at what ratio or against which lots. Guessing would silently
# corrupt every later sale of that holding. When one appears, the import stops and
# names it, and the answer is the matching command: apply split, apply reverse-split,
# apply spin-off, apply cash-in-lieu. Adding any of these phrases below to make an
# import proceed is the one edit to this file that will lose you money.
action.IGNORE =
