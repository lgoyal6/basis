# Fidelity Accounts History export.
#
# Get one: log in, pick the account, Activity & Orders, History, set a date range,
# Apply, then Download. Fidelity caps each download at 90 days and keeps 5 years,
# so a full history is several files. Importing overlapping files is safe: rows
# already in the ledger are skipped.
#
# WRITTEN FROM KNOWLEDGE OF THE FORMAT, NOT FROM A REAL EXPORT. Expect one of the
# column names or action phrases below to need a correction on first contact. That
# correction is an edit to this file, not to any code.
#
# Lists are separated by | rather than by commas, because a column really can be
# called "Amount, Net" and a separator that appears inside values is not a separator.
# Header matching ignores case and anything in parentheses, so "Price ($)" matches
# "Price". Action matching is by longest prefix, since the real text continues past
# the verb: "YOU BOUGHT PROSHARES ULTRAPRO QQQ".

profile.name = Fidelity

date.formats = MM/dd/yyyy | M/d/yyyy | yyyy-MM-dd

column.date        = Run Date | Date | Trade Date | Settlement Date
column.action      = Action | Transaction Type | Description of Transaction
column.symbol      = Symbol | Ticker
column.description = Description | Security Description
column.quantity    = Quantity | Shares
column.price       = Price | Price Per Share | Average Price
column.commission  = Commission
column.fees        = Fees | Fee
column.amount      = Amount | Net Amount | Net Cash Amount

action.BUY               = YOU BOUGHT | BOUGHT | PURCHASE
action.SELL              = YOU SOLD | SOLD | REDEMPTION
action.REINVESTMENT      = REINVESTMENT | DIVIDEND REINVEST
action.CASH_DIVIDEND     = DIVIDEND RECEIVED | CASH DIVIDEND | LONG-TERM CAP GAIN | SHORT-TERM CAP GAIN | CAPITAL GAIN
action.FEE               = FEE CHARGED | SERVICE FEE | ADR FEE
action.WITHHOLDING       = FOREIGN TAX PAID | TAX WITHHELD | WITHHOLDING
action.CASH_TRANSFER     = ELECTRONIC FUNDS TRANSFER | DIRECT DEPOSIT | DIRECT DEBIT | WIRE TRANSFER | CASH CONTRIBUTION | CASH DISTRIBUTION | JOURNALED
action.SECURITY_TRANSFER = TRANSFERRED SECURITIES | TRANSFER OF ASSETS

# Rows that carry no ledger effect. Skipping happens only because a phrase is
# listed here, and the import reports how many rows it skipped, so nothing is
# dropped silently. Leave this empty until a real statement tells you otherwise:
# an unrecognised row stopping the import is the behaviour you want first.
action.IGNORE =
