# Charles Schwab transactions export.
#
# UNVERIFIED, and here as a worked example of what adding a broker costs: this file
# and nothing else. No code was written for it. If it is wrong, correcting it is a
# text edit, and a row it cannot read will stop an import and print the exact
# wording it did not recognise, which is how you find out what to put here.

profile.name = Schwab

date.formats = MM/dd/yyyy | M/d/yyyy | yyyy-MM-dd

column.date        = Date | Trade Date
column.action      = Action | Transaction Type
column.symbol      = Symbol
column.description = Description
column.quantity    = Quantity
column.price       = Price
column.commission  = Fees & Comm | Commission
column.fees        = Fees
column.amount      = Amount

action.BUY               = BUY | BOUGHT
action.SELL              = SELL | SOLD
action.REINVESTMENT      = REINVEST SHARES | REINVEST DIVIDEND
action.CASH_DIVIDEND     = QUALIFIED DIVIDEND | CASH DIVIDEND | SPECIAL DIVIDEND | LONG TERM CAP GAIN | SHORT TERM CAP GAIN
action.FEE               = SERVICE FEE | ADR MGMT FEE | FOREIGN TRANSACTION FEE
action.WITHHOLDING       = NRA WITHHOLDING | FOREIGN TAX PAID
action.CASH_TRANSFER     = MONEYLINK TRANSFER | JOURNAL | WIRE FUNDS | CASH IN LIEU
action.SECURITY_TRANSFER = SECURITY TRANSFER | JOURNALED SHARES

action.IGNORE =
