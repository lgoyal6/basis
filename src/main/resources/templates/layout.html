<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, body)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | basis'">basis</title>
  <!-- A ruled tick in a box: what you draw next to a line you have checked. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231b1a17'/><path d='M3.5 8.6l3 3 6-7' stroke='%23fdfcfa' stroke-width='1.8' fill='none' stroke-linecap='square'/></svg>">
  <link rel="stylesheet" th:href="@{/basis.css}">
  <!-- Vendored, not from a CDN. A page asking a stranger to upload their trading history
       should not also be asking a third party to watch them do it. -->
  <script th:src="@{/vendor/htmx.min.js}" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" th:href="@{/}">basis</a>
      <nav>
        <a th:href="@{/privacy}">Your data</a>
        <a href="https://github.com/lgoyal6/basis">Source</a>
      </nav>
    </div>
  </header>
  <main class="wrap" th:replace="${body}"></main>
  <footer class="wrap">
    <p>basis recomputes your positions from your own transaction history and tells you where it
      disagrees with your broker. It is not tax advice and it does not file anything.</p>
  </footer>
</body>
</html>
