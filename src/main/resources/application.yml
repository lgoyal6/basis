spring:
  application:
    name: basis
  # No web layer. basis is a command line process over an append only ledger.
  main:
    web-application-type: none
    # A banner is fine for a service someone starts once. For a command that prints a
    # break and exits, it is six lines of noise above the answer.
    banner-mode: off
    # "Starting BasisApplication..." is logged under com.basis, so quietening the root
    # logger does not remove it. This is the switch that does.
    log-startup-info: false
  datasource:
    url: ${BASIS_DB_URL:jdbc:postgresql://localhost:5432/basis}
    username: ${BASIS_DB_USER:basis}
    password: ${BASIS_DB_PASSWORD:basis}
  flyway:
    enabled: true
    # Never clean a ledger. The whole point of the append only table is that it
    # cannot be thrown away by accident.
    clean-disabled: true
    baseline-on-migrate: false

# Market data provider. The key comes from the environment and is never committed.
#
# Note that Spring does not read the .env file in this repository: that file exists for
# the week 0 probe. Export it before running, for example:
#   set -a; source .env; set +a
basis:
  fmp:
    base-url: https://financialmodelingprep.com/stable
    key: ${FMP_KEY:}
    # Off by default so nothing reaches the network unless someone asks for it.
    enabled: ${BASIS_FMP_ENABLED:false}
    timeout: 20s
    refresh-after: 7d
    # A ceiling this application imposes, not one the provider communicates: it returns
    # no rate limit headers. See docs/FEASIBILITY.md.
    daily-request-budget: 50

# A command prints an answer and exits. Framework startup chatter around that answer is
# noise, so the root logger is quiet and only basis speaks. Raise it when diagnosing:
#   --logging.level.root=INFO
logging:
  level:
    root: WARN
    com.basis: INFO
  pattern:
    console: "%-5level %msg%n"
