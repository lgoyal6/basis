spring:
  servlet:
    multipart:
      # Matched to basis.web.max-bytes below. Two limits because the container
      # rejects an oversized upload before any basis code sees it, and that
      # rejection needs to be at the same threshold the page advertises.
      max-file-size: 5MB
      max-request-size: 11MB
  thymeleaf:
    cache: true
  application:
    name: basis
  # No web layer. basis is a command line process over an append only ledger.
  main:
    # Not set here any more. This file is read by both shapes of the process, and a value
    # pinned in config beats the one SpringApplicationBuilder passes, so "serve" started and
    # then exited without ever opening a port. The CLI now asks for NONE explicitly in code,
    # next to the exit-code handling that depends on it.
    web-application-type: ${BASIS_WEB_TYPE:none}
    # A banner is fine for a service someone starts once. For a command that prints a
    # break and exits, it is six lines of noise above the answer.
    banner-mode: off
    # "Starting BasisApplication..." is logged under com.basis, so quietening the root
    # logger does not remove it. This is the switch that does.
    log-startup-info: false
  datasource:
    url: ${BASIS_DB_URL:jdbc:postgresql://localhost:5432/basis}
    username: ${BASIS_DB_USER:basis}
    password: ${BASIS_DB_PASSWORD:basis}
  flyway:
    enabled: true
    # Never clean a ledger. The whole point of the append only table is that it
    # cannot be thrown away by accident.
    clean-disabled: true
    baseline-on-migrate: false

# Market data provider. The key comes from the environment and is never committed.
#
# Note that Spring does not read the .env file in this repository: that file exists for
# the week 0 probe. Export it before running, for example:
#   set -a; source .env; set +a
basis:
  # Only read under "basis serve". A public endpoint's limits are an operational decision
  # rather than a design one, so they live in config where they can be changed per deploy.
  web:
    max-bytes: 5242880
    max-rows: 50000
    session-minutes: 120
  fmp:
    base-url: https://financialmodelingprep.com/stable
    key: ${FMP_KEY:}
    # Off by default so nothing reaches the network unless someone asks for it.
    enabled: ${BASIS_FMP_ENABLED:false}
    timeout: 20s
    refresh-after: 7d
    # The free plan states 250 API calls per day, read off the dashboard because the API
    # publishes no rate limit headers. Set to half of it so one refresh run cannot spend
    # the whole allowance and leave nothing for a second attempt the same day.
    daily-request-budget: 125

# A command prints an answer and exits. Framework startup chatter around that answer is
# noise, so the root logger is quiet and only basis speaks. Raise it when diagnosing:
#   --logging.level.root=INFO
logging:
  level:
    root: WARN
    com.basis: INFO
  pattern:
    console: "%-5level %msg%n"
